# Banhammer example configuration.
# Everything below except `monitors:` is optional — the defaults shown are the
# built-in ones, so a commented-out line and the line uncommented behave alike.

# ---------------------------------------------------------------- global
state_dir: /var/lib/banhammer      # bans.json + offsets.json live here
log_format: text                   # text | json
# queue_size: 8192                 # events buffered between readers and workers;
                                   # overflow increments lines_dropped

defaults:
  threshold: 5                     # X: hits required to trigger a ban
  window: 10m                      # Y: ...within this rolling window
  bantime: 1h                      # Z: ...then unban after this long
  action: iptables                 # iptables | ipset | nft | dryrun | <inline block>
  # action:                        # use block syntax to customize chain or timeout:
  #   name: iptables               # iptables | ipset | nft | dryrun
  #   chain: INPUT                 # INPUT (default) | DOCKER-USER (for Docker hosts) | FORWARD | ...
  #   timeout: 10s
  #   flush_on_exit: false         # true removes the chain/table/sets (and every
  #                                 # rule in them) on a clean shutdown; ignored by cmd
  start_at: checkpoint             # checkpoint | end | beginning
  on_repeat: ignore                # ignore | extend  (behaviour when an already-banned IP re-offends)
  # bantime_factor: 2              # multiply bantime by this per prior offense (1 = no escalation)
  # bantime_max: 168h              # ceiling for an escalated bantime
  # find_history: 168h             # how long prior offenses count towards escalation
  # max_tracked: 100000            # LRU cap on tracked IPs, per monitor

allow_local: true                  # never ban loopback or this host's own addresses
allowlist:
  - 127.0.0.1/8
  - ::1/128
  - 10.0.0.0/8
  - 192.168.0.0/16

# metrics:
#   listen: 127.0.0.1:9777         # Prometheus endpoint (/metrics, /healthz); omit to disable

# web:                             # read-only status page with ban statistics
#   enabled: true                  # off by default
#   listen: 127.0.0.1:7980         # default; use 0.0.0.0:7980 to reach it from elsewhere
#                                  # (the page lists banned addresses and watched log
#                                  # paths — put a reverse proxy with auth in front)
#   geoip: /usr/share/GeoIP/GeoLite2-Country.mmdb
#                                  # optional country database for the geography charts:
#                                  # a MaxMind .mmdb (GeoLite2/GeoIP2/DB-IP country) or a
#                                  # start_ip,end_ip,country_code CSV (dbip-country-lite,
#                                  # sapics/ip-location-db); .csv.gz is fine
#   retention: 720h                # how long ban events are kept for the statistics
#                                  # (also what `banhammer status` reports); 30 days
#   log_lines: true                # keep the log line that triggered each ban (shown on
#                                  # the page and in `status`); set false if your logs
#                                  # carry usernames or URLs you would rather not keep

# ---------------------------------------------------------------- monitors
monitors:

  # Minimal: plain-text log, one regex, all defaults.
  sshd:
    file: /var/log/auth.log
    match: "Failed password .* from <IP>"
    # contains: "Failed password"   # literal prefilter; derived from the regex
                                    # when omitted, set it only when that guess
                                    # is wrong (e.g. an alternation)

  # Multiple patterns (OR), plus an exception.
  sshd-strict:
    file: /var/log/auth.log
    match:
      - "Invalid user .* from <IP>"
      - "Connection closed by authenticating user .* <IP> .* \\[preauth\\]"
    ignore: "from <IP> port \\d+ ssh2: RSA SHA256:knownkey"
    threshold: 3
    bantime: 24h

  # Glob over rotated/multiple files.
  nginx-auth:
    file: /var/log/nginx/*access.log
    match: '^<IP> .* "(GET|POST) [^"]*" 40[13] '
    threshold: 10
    window: 5m

  # JSON log: per-field regexes (AND) and a structured IP field.
  caddy:
    file: /var/log/caddy/access.log
    format: json
    match:
      status: "^(401|403|404)$"
      request.uri: "\\.(env|git|ini|php)$"
    ip_field: request.remote_ip
    threshold: 20
    window: 1m
    bantime: 24h

  # Remote syslog over the network, custom nftables action.
  remote:
    listen: udp://0.0.0.0:5140
    strip_syslog: true
    match: "authentication failure.*rhost=<IP>"
    action:
      start: "nft add table inet banhammer ; nft add set inet banhammer banned { type ipv4_addr\\; flags timeout\\; }"
      ban:   "nft add element inet banhammer banned { {ip} timeout {bantime} }"
      unban: "nft delete element inet banhammer banned { {ip} }"
      shell: true                  # only needed because of the ';' above

  # Piped input: `journalctl -f -u myapp | banhammer run`
  # myapp:
  #   stdin: true
  #   match: "login failed for .* ip=<IP>"
  #   action:
  #     ban: "/usr/local/bin/notify-and-block {ip} {monitor}"
  #     unban: "/usr/local/bin/unblock {ip}"
