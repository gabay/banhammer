# Banhammer example configuration.
# Everything below except `monitors:` is optional — the defaults shown are the built-in ones.

# ---------------------------------------------------------------- global
state_dir: /var/lib/banhammer      # bans.json + offsets.json live here
log_format: text                   # text | json

defaults:
  threshold: 5                     # X: hits required to trigger a ban
  window: 10m                      # Y: ...within this rolling window
  bantime: 1h                      # Z: ...then unban after this long
  action: iptables                 # iptables | ipset | nft | dryrun | <inline cmd block>
  start_at: checkpoint             # checkpoint | end | beginning
  on_repeat: ignore                # ignore | extend  (behaviour when an already-banned IP re-offends)

allow_local: true                  # never ban loopback or this host's own addresses
allowlist:
  - 127.0.0.1/8
  - ::1/128
  - 10.0.0.0/8
  - 192.168.0.0/16

# metrics:
#   listen: 127.0.0.1:9777         # Prometheus endpoint; omit to disable

# ---------------------------------------------------------------- monitors
monitors:

  # Minimal: plain-text log, one regex, all defaults.
  sshd:
    file: /var/log/auth.log
    match: "Failed password .* from <IP>"

  # Multiple patterns (OR), plus an exception.
  sshd-strict:
    file: /var/log/auth.log
    match:
      - "Invalid user .* from <IP>"
      - "Connection closed by authenticating user .* <IP> .* \\[preauth\\]"
    ignore: "from <IP> port \\d+ ssh2: RSA SHA256:knownkey"
    threshold: 3
    bantime: 24h

  # Glob over rotated/multiple files.
  nginx-auth:
    file: /var/log/nginx/*access.log
    match: '^<IP> .* "(GET|POST) [^"]*" 40[13] '
    threshold: 10
    window: 5m

  # JSON log: per-field regexes (AND) and a structured IP field.
  caddy:
    file: /var/log/caddy/access.log
    format: json
    match:
      status: "^(401|403|404)$"
      request.uri: "\\.(env|git|ini|php)$"
    ip_field: request.remote_ip
    threshold: 20
    window: 1m
    bantime: 24h

  # Remote syslog over the network, custom nftables action.
  remote:
    listen: udp://0.0.0.0:5140
    strip_syslog: true
    match: "authentication failure.*rhost=<IP>"
    action:
      start: "nft add table inet banhammer ; nft add set inet banhammer banned { type ipv4_addr\\; flags timeout\\; }"
      ban:   "nft add element inet banhammer banned { {ip} timeout {bantime} }"
      unban: "nft delete element inet banhammer banned { {ip} }"
      shell: true                  # only needed because of the ';' above

  # Piped input: `journalctl -f -u myapp | banhammer run`
  # myapp:
  #   stdin: true
  #   match: "login failed for .* ip=<IP>"
  #   action:
  #     ban: "/usr/local/bin/notify-and-block {ip} {monitor}"
  #     unban: "/usr/local/bin/unblock {ip}"
